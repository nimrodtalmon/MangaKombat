<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MangaKombat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
      touch-action: none;
    }
    #game-wrap {
      width: 100vw;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading {
      color: #fff;
      font-size: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="game-wrap">
    <canvas id="game" style="display:none" width="800" height="450"></canvas>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
